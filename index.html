<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h3>1. Счетчик лайков</h3>
        <h1 id="count">0</h1>
        <button id="likeBtn">Лайк</button>
    </div>

    <div class="card">
        <h3>2. Генератор приветствий</h3>
        <input type="text" id="nameInput" placeholder="Ваше имя"><br>
        <button id="officialBtn">Официально</button>
        <button id="friendlyBtn">Дружески</button>
        <h1 id="greetingText" style="font-size: 20px; margin-top: 10px;"></h1>
    </div>

    <div class="card">
        <h3>3. Сумма чисел до N</h3>
        <input type="number" id="numInput" placeholder="Введите число N"><br>
        <button id="calcBtn">Посчитать</button>
        <h1 id="sumResult">0</h1>
    </div>

    <script src="script.js"></script>
</body>
</html>
